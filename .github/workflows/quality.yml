name: Template quality gate
# Prevent duplicate runs on the same ref from racing dependency cache uploads.
concurrency:
  group: template-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:template
      - run: node scripts/prepare-ci-client.mjs && pnpm scaffold:client && pnpm verify:template
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
        env:
          CI: 'true'
